<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICCT Student Portal - Payment Submitted</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body.dashboard-body { background-color: #F8FAFC; min-height: 100vh; }

    .topbar {
      height: 64px; background-color: #1E3A8A; color: #FFFFFF; display: flex;
      justify-content: space-between; align-items: center; padding: 0 32px;
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    }

    .header-left, .header-right { display: flex; align-items: center; gap: 14px; }
    .mini-logo { width: 36px !important; height: 36px !important; object-fit: contain; }
    .portal-title { font-weight: 700; font-size: 16px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-text { display: flex; flex-direction: column; text-align: right; }
    .user-name { font-weight: 700; font-size: 14px; }
    .user-role { font-size: 11px; opacity: 0.8; }
    .avatar-icon { font-size: 24px; color: #FFFFFF; }

    .btn-logout { background-color: #EF4444; color: white; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; }
    .student-container { max-width: 600px; margin: 100px auto 40px; padding: 0 20px; }

    .confirmation-card {
      background: white; border-radius: 16px; padding: 40px 32px;
      border: 1px solid #E2E8F0; box-shadow: 0 10px 25px rgba(0,0,0,0.04); text-align: center;
    }

    .success-circle {
      width: 72px; height: 72px; background: #DCFCE7; color: #16A34A;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 20px;
    }

    .confirmation-card h2 { font-size: 24px; color: #0F172A; font-weight: 800; margin-bottom: 10px; }
    .confirmation-message { font-size: 14px; color: #475569; margin-bottom: 28px; line-height: 1.5; }

    .badge-pending {
      background: #FEF3C7; color: #D97706; padding: 2px 10px;
      border-radius: 12px; font-weight: 700; font-size: 12px;
    }

    .receipt-summary-box {
      background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px;
      padding: 20px 24px; margin-bottom: 32px; display: flex; flex-direction: column; gap: 12px; text-align: left;
    }

    .receipt-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #64748B; }
    .receipt-row strong { color: #0F172A; }

    .btn-primary-action {
      background: #2563EB; color: white; padding: 14px 32px; border: none;
      border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
    }
    .btn-primary-action:hover { background: #1D4ED8; }
  </style>
</head>
<body class="dashboard-body">

  <header class="topbar">
    <div class="header-left">
      <img src="logo.png" alt="Logo" class="mini-logo">
      <span class="portal-title">ICCT Student Portal</span>
    </div>
    <div class="header-right">
      <div class="user-info">
        <i class="fa-solid fa-circle-user avatar-icon"></i>
        <div class="user-text">
          <span class="user-name">Jerome Opana</span>
          <span class="user-role">Student (BSCPE)</span>
        </div>
      </div>
      <a href="index.html" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
    </div>
  </header>

  <main class="student-container">
    <div class="confirmation-card">
      <div class="success-circle"><i class="fa-solid fa-check"></i></div>

      <h2>Payment Submitted!</h2>
      <p class="confirmation-message">
        Your payment proof for <strong id="confFeeName">Department Dues</strong> has been submitted successfully and is now <span class="badge-pending">PENDING</span> verification.
      </p>

      <div class="receipt-summary-box">
        <div class="receipt-row"><span>Reference Number:</span><strong id="confRefNum">GC-123456</strong></div>
        <div class="receipt-row"><span>Amount Paid:</span><strong id="confAmount">₱500.00</strong></div>
        <div class="receipt-row"><span>Date Submitted:</span><span id="confDate">October 2, 2026</span></div>
        <div class="receipt-row"><span>Uploaded Receipt:</span><span id="confFileName" style="font-weight:600; color:#2563EB;">receipt.png</span></div>
      </div>

      <button type="button" class="btn-primary-action" onclick="window.location.href='student.html'">
        Back to Dashboard
      </button>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lastPayment = JSON.parse(localStorage.getItem("latestPayment"));
      if (lastPayment) {
        document.getElementById("confFeeName").textContent = lastPayment.feeName;
        document.getElementById("confRefNum").textContent = lastPayment.refNumber;
        document.getElementById("confAmount").textContent = "₱" + lastPayment.amount + ".00";
        document.getElementById("confFileName").textContent = lastPayment.fileName;
        const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById("confDate").textContent = today;
      }
    });
  </script>
</body>
</html>
